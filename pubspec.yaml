name: voltpulse
description: "VoltPulse — live battery health and charging monitor."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_bloc: ^9.1.1
  equatable: ^3.0.0
  get_it: ^9.3.0
  lottie: ^3.7.0
  fl_chart: ^1.3.1
  flutter_animate: ^4.5.2
  google_fonts: ^8.2.1
  shared_preferences: ^2.5.6
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/lottie/
